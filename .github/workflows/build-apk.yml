name: Build APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle downloads
        uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          # Stable names (same download link every build)
          cp app/build/outputs/apk/release/app-release.apk      out/wifi-scanner.apk
          cp alarm/build/outputs/apk/release/alarm-release.apk   out/loud-alarm.apk
          # Versioned copies (kept in the per-version release)
          cp out/wifi-scanner.apk "out/wifi-scanner-v$VERSION.apk"
          cp out/loud-alarm.apk   "out/loud-alarm-v$VERSION.apk"

      - name: Upload APKs (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: apks-v${{ env.VERSION }}
          path: out/*.apk

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MSG="$(git log -1 --pretty=%s)"

          # 1) Permanent release for this version (kept forever)
          gh release create "v$VERSION" \
            "out/wifi-scanner-v$VERSION.apk" "out/loud-alarm-v$VERSION.apk" \
            --title "v$VERSION" \
            --notes "Build $GITHUB_RUN_NUMBER from ${GITHUB_SHA::7}: $MSG"

          # 2) 'latest' release — same download links every time
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "out/wifi-scanner.apk" "out/loud-alarm.apk" \
            --title "Latest build (v$VERSION)" \
            --latest \
            --notes "Newest version: v$VERSION. Download an APK on your phone and tap it to install or update.

- WiFi Scanner: wifi-scanner.apk
- Loud Alarm: loud-alarm.apk"
