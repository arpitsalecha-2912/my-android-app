name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle downloads
        uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64 and SIGNING_PASSWORD in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk my-android-app.apk
          cp my-android-app.apk "my-android-app-v$VERSION.apk"

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: my-android-app-v${{ env.VERSION }}
          path: my-android-app-v${{ env.VERSION }}.apk

      - name: Publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1) Permanent release for this version (kept forever)
          gh release create "v$VERSION" "my-android-app-v$VERSION.apk" \
            --title "v$VERSION" \
            --notes "Build $GITHUB_RUN_NUMBER from commit ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"

          # 2) 'latest' release — same download link every time
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest my-android-app.apk \
            --title "Latest build (v$VERSION)" \
            --notes "Newest version: v$VERSION. Download my-android-app.apk on your phone and tap it to install or update." \
            --latest
